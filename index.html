<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>I love you 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cairo:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link href="main.css" rel="stylesheet" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='pink'/><text x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='middle'>❤️</text></svg>"
    />
  </head>
  <body>
    <div class="floats-container" id="floatsContainer">
      <div class="float-item">❤️</div>
      <div class="float-item">💗</div>
      <div class="float-item">💕</div>
      <div class="float-item">❤️</div>
      <div class="float-item">💖</div>
      <div class="float-item">💗</div>
    </div>

    <div class="login-container">
      <div class="heart-container">
        <div class="big-heart"></div>

        <div class="login-content">
          <!-- الصورة من Supabase -->

          <div class="photo-circle-wrap">
            <div class="photo-circle">
              <img
                src="https://res.cloudinary.com/dvc3zpg1i/image/upload/v1777667717/clients/mszernngoubvptsh3r52.jpg"
                alt="photo"
              />
            </div>
          </div>

          <!-- العنوان والسب تايتل من Supabase -->
          <h1 class="login-title">جاهزه😉</h1>
          <p class="login-subtitle">كل الي بينا هنا 😍</p>

          <form action="love-you.html" method="GET" id="loginForm">
            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="text"
                id="password"
                name="password"
                placeholder="password"
                required
              />
            </div>
            <button type="submit" class="login-btn">💕 Unlock 💕</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const password = document.getElementById("password").value;

          if (
            /*password === "love" ||
            password === "Love" ||
            password === "LOVE"*/
			password === "happy birthday yoyo"
          ) {
            window.location.href = "love-you.html";
          } else {
            alert("الباسورد غلط يا يويو 😂💕");
          }
        });

      /* Click/Touch particle effect */
      document.addEventListener("click", spawnParticles);
      document.addEventListener(
        "touchstart",
        (e) => {
          [...e.touches].forEach((t) =>
            spawnParticles({ clientX: t.clientX, clientY: t.clientY }),
          );
        },
        { passive: true },
      );

      function spawnParticles(e) {
        const count = 8;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.textContent = icons[Math.floor(Math.random() * icons.length)];
          const angle = (360 / count) * i + Math.random() * 20;
          const dist = 60 + Math.random() * 80;
          const rad = (angle * Math.PI) / 180;
          const dx = Math.cos(rad) * dist;
          const dy = Math.sin(rad) * dist;
          el.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px;
                    top: ${e.clientY}px;
                    font-size: ${16 + Math.random() * 18}px;
                    pointer-events: none;
                    z-index: 9999;
                    transform: translate(-50%, -50%);
                    transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                    opacity: 1;
                `;
          document.body.appendChild(el);
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
              el.style.opacity = "0";
            }),
          );
          setTimeout(() => el.remove(), 900);
        }
      }

      /* Dynamic floating hearts */
      const heartIcons = ["❤️", "💗", "💕", "💖"];
      setInterval(() => {
        for (let i = 0; i < 3; i++) {
          const el = document.createElement("div");
          el.className = "float-item";
          el.textContent =
            heartIcons[Math.floor(Math.random() * heartIcons.length)];
          el.style.left = Math.random() * 100 + "%";
          el.style.fontSize = Math.random() * 14 + 28 + "px";
          el.style.animationDuration = Math.random() * 5 + 8 + "s";
          el.style.animationDelay = Math.random() * 0.8 + "s";
          el.style.opacity = "0";
          document.getElementById("floatsContainer").appendChild(el);
          setTimeout(() => el.remove(), 15000);
        }
      }, 600);
    </script>
  </body>
</html>
